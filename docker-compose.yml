services:
  postgres:
    image: postgres:16-alpine
    container_name: sport-coach-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sport_coach_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sportcoach
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sport_coach_app"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: sport-coach-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
